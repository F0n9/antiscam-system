version: '3.8'

services:
  # Cơ sở dữ liệu quan hệ (Auth, Reports, App metadata)
  postgres:
    image: postgres:16-alpine
    container_name: antiscam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antiscam_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antiscam_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-antiscam_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antiscam_admin} -d ${POSTGRES_DB:-antiscam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cơ sở dữ liệu đồ thị (Mạng lưới liên kết thực thể, Cypher query)
  neo4j:
    image: neo4j:5.18.0-community
    container_name: antiscam_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-antiscam_neo4j_pass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt Protocol cho Driver
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # Máy chủ ứng dụng FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antiscam_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

